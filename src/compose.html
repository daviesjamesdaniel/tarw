<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compose</title>
    <script type="module" src="/compose.js" defer></script>
  </head>

  <body class="compose-standalone">
    <form id="compose-form" class="compose-panel">
      <div class="compose-field" id="compose-account-field" hidden>
        <label for="compose-account">From</label>
        <select id="compose-account"></select>
      </div>
      <div class="compose-field compose-field-recipient">
        <label for="compose-to">To</label>
        <input type="text" id="compose-to" required autocomplete="off" />
        <div class="recipient-suggestions" id="compose-to-suggestions" hidden></div>
        <div class="compose-cc-bcc-toggles">
          <button type="button" id="compose-show-cc" class="compose-field-toggle">Cc</button>
          <button type="button" id="compose-show-bcc" class="compose-field-toggle">Bcc</button>
        </div>
      </div>
      <div class="compose-field compose-field-recipient" id="compose-cc-field" hidden>
        <label for="compose-cc">Cc</label>
        <input type="text" id="compose-cc" autocomplete="off" />
        <div class="recipient-suggestions" id="compose-cc-suggestions" hidden></div>
      </div>
      <div class="compose-field compose-field-recipient" id="compose-bcc-field" hidden>
        <label for="compose-bcc">Bcc</label>
        <input type="text" id="compose-bcc" autocomplete="off" />
        <div class="recipient-suggestions" id="compose-bcc-suggestions" hidden></div>
      </div>
      <div class="compose-field">
        <label for="compose-subject">Subject</label>
        <input type="text" id="compose-subject" autocomplete="off" />
      </div>
      <div class="compose-toolbar" id="compose-toolbar">
        <button type="button" class="compose-tool" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button type="button" class="compose-tool" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button type="button" class="compose-tool" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <span class="compose-tool-sep"></span>
        <button type="button" class="compose-tool" data-cmd="insertUnorderedList" title="Bulleted list"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6" r="1"/><line x1="9" y1="6" x2="20" y2="6"/><circle cx="4" cy="12" r="1"/><line x1="9" y1="12" x2="20" y2="12"/><circle cx="4" cy="18" r="1"/><line x1="9" y1="18" x2="20" y2="18"/></svg></button>
        <button type="button" class="compose-tool" data-cmd="insertOrderedList" title="Numbered list"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><text x="1.5" y="8.5" font-size="7" stroke="none" fill="currentColor" font-family="sans-serif">1</text><line x1="9" y1="6" x2="20" y2="6"/><text x="1.5" y="14.5" font-size="7" stroke="none" fill="currentColor" font-family="sans-serif">2</text><line x1="9" y1="12" x2="20" y2="12"/><text x="1.5" y="20.5" font-size="7" stroke="none" fill="currentColor" font-family="sans-serif">3</text><line x1="9" y1="18" x2="20" y2="18"/></svg></button>
        <button type="button" class="compose-tool" id="compose-link-button" title="Insert link">&#128279;</button>
        <button type="button" class="compose-tool" id="compose-image-button" title="Insert image">&#128444;</button>
        <span class="compose-tool-sep"></span>
        <button type="button" class="compose-tool" id="compose-attach-button" title="Attach file"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <span class="compose-tool-sep"></span>
        <label class="compose-signature-toggle" id="compose-signature-label">
          <input type="checkbox" id="compose-signature-toggle" /> Signature
        </label>
        <select id="compose-signature-select" class="compose-signature-select" aria-label="Signature" hidden></select>
        <span class="compose-tool-sep"></span>
        <select id="compose-font-family" class="compose-font-select" title="Font">
        </select>
        <select id="compose-font-size" class="compose-font-select" title="Text size">
          <option value="">Default</option>
          <option value="1">Tiny</option>
          <option value="2">Small</option>
          <option value="3">Normal</option>
          <option value="4">Large</option>
          <option value="5">Larger</option>
        </select>
        <label class="compose-color-tool" title="Text colour">
          <span class="compose-color-icon">A</span>
          <input type="color" id="compose-text-color" value="#1a1a1a" />
        </label>
        <label class="compose-color-tool" title="Highlight">
          <span class="compose-color-icon compose-highlight-icon">A</span>
          <input type="color" id="compose-highlight-color" value="#fff176" />
        </label>
      </div>
      <div id="compose-attachments-bar" class="attachment-bar" hidden></div>
      <iframe
        id="compose-body"
        class="compose-body"
        title="Message body"
        sandbox="allow-same-origin"
      ></iframe>
      <div class="compose-footer">
        <span id="compose-error" class="compose-error"></span>
        <button type="button" id="compose-cancel" class="compose-secondary">Cancel</button>
        <button type="button" id="compose-save-draft" class="compose-secondary">Save draft</button>
        <button type="submit" id="compose-send" class="compose-send">Send</button>
      </div>
    </form>
  </body>
</html>
