name: Build

# Mirrors the exact commands documented in packaging/arch, packaging/deb, and
# packaging/rpm - not a separate, parallel build path that could drift from
# what a real user actually runs. Catches missing-dependency and packaging
# regressions (e.g. a broken TOML key, a missing shared lib at install time)
# before they reach a tagged release, rather than relying on someone
# remembering to test all three distros by hand.
# Day-to-day work pushes to dev, where this runs first; main only ever
# receives merges from dev once it's green, so it stays release-ready. main
# is still listed here too as a cheap extra safety net (e.g. a direct hotfix),
# not because it's expected to be where problems get caught.
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap and fast, so it fails before the heavy distro builds spin up. Run
  # `cargo fmt` in src-tauri to fix a failure.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # rust/cargo/mold installed explicitly here rather than left for makepkg's
      # own makedepends resolution - the rust-cache step below needs a working
      # `rustc -vV` to compute its cache key, and that has to happen before
      # `makepkg -s` would otherwise install the toolchain for the first time.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo rust cargo mold

      - uses: actions/checkout@v4

      # makepkg refuses to run as root - create an unprivileged build user
      # (standard pattern for Arch packaging in a container), give it
      # passwordless sudo so `makepkg -s` can install its own makedepends,
      # and hand it ownership of the checkout.
      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # The cache action itself still runs as root (the container's default
      # user), so its restore lands as root-owned files - HOME=/home/builder
      # points it at the same place `sudo -u builder` uses, and the chown
      # step right after hands ownership to builder before the build needs to
      # write new entries into it (a build failing to add a new dependency
      # to a root-owned cache dir would be a confusing way to find this out).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
        env:
          HOME: /home/builder

      - name: Fix cache ownership for the build user
        run: |
          mkdir -p /home/builder/.cargo "$GITHUB_WORKSPACE/src-tauri/target"
          chown -R builder:builder /home/builder/.cargo "$GITHUB_WORKSPACE/src-tauri/target"

      - name: Build and install the package
        run: sudo -u builder makepkg -si --noconfirm
        working-directory: packaging/arch

      - name: Verify the binary and its shared libraries resolve
        run: |
          test -x /usr/bin/tarw
          ldd /usr/bin/tarw | grep -i "not found" && exit 1 || true

  debian:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git build-essential pkg-config ca-certificates \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev mold

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Every run was a fully clean build - ~600 dependencies recompiled from
      # scratch every single time. This caches the registry, git checkouts,
      # and target/ dir between runs, keyed on Cargo.lock - only genuinely
      # changed/new dependencies need rebuilding on a cache hit.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the .deb
        run: |
          . "$HOME/.cargo/env"
          cargo install cargo-deb --locked
          cd src-tauri
          cargo deb --locked

      - name: Install the .deb
        run: apt-get install -y ./src-tauri/target/debian/tarw_*.deb

      - name: Verify the binary and its shared libraries resolve
        run: |
          test -x /usr/bin/tarw
          ldd /usr/bin/tarw | grep -i "not found" && exit 1 || true

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            curl git gcc pkgconf-pkg-config \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            librsvg2-devel openssl-devel rpm-build mold

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the .rpm
        run: |
          . "$HOME/.cargo/env"
          cargo install cargo-generate-rpm --locked
          cd src-tauri
          cargo build --release --locked
          cargo generate-rpm

      - name: Install the .rpm
        run: dnf install -y ./src-tauri/target/generate-rpm/tarw-*.rpm

      - name: Verify the binary and its shared libraries resolve
        run: |
          test -x /usr/bin/tarw
          ldd /usr/bin/tarw | grep -i "not found" && exit 1 || true

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Binary cache for this repo's own build outputs - same purpose as
      # Swatinem/rust-cache above (avoid re-fetching/re-building unchanged
      # dependencies every run), just the Nix-native equivalent. Switched
      # from DeterminateSystems/magic-nix-cache-action (2026-09-14): its
      # GitHub-Actions-Cache-backed fallback got rate-limited on the very
      # first run ("GitHub Actions Cache throttled Magic Nix Cache"),
      # likely from contention with the other three jobs' own rust-cache
      # use, so it never actually cached anything. Cache is public - lets
      # end users' `nix profile install` (see the update modal) benefit
      # from it too, not just CI.
      - uses: cachix/cachix-action@v14
        with:
          name: tarw
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build --print-build-logs

      - name: Verify the binary and its shared libraries resolve
        run: |
          test -x result/bin/tarw
          ldd result/bin/tarw | grep -i "not found" && exit 1 || true

  # Only runs for a version tag push, and only once all three distro builds
  # above have succeeded (GitHub Actions skips a job automatically if any of
  # its `needs` fails) - a broken build on any distro stops the release
  # before it's published, rather than relying on remembering to check.
  publish-release:
    needs: [arch, debian, fedora, nix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 alone isn't enough for a tag-triggered run - actions/checkout
      # can still leave the tag as a lightweight ref rather than the full annotated
      # tag object, silently degrading %(contents:subject)/%(contents:body) below to
      # the underlying commit's message instead of the tag's own (confirmed: this is
      # exactly what happened on v0.3.6's first auto-published release - title came
      # out as the commit message "Bump version to 0.3.6", not the tag's title, and
      # the notes body was empty).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # fetch-depth:0 + fetch-tags:true still isn't enough (recurred on v0.3.7
      # after already once being "fixed" for v0.3.6 - see below): actions/checkout
      # correctly fetches the real annotated tag object first, then does its own
      # second, "optimized" fetch keyed on the tag event's GITHUB_SHA - which
      # GitHub sets to the underlying *commit* SHA for a tag push, not the tag
      # object's SHA - and that second fetch silently overwrites refs/tags/$tag
      # locally with a lightweight ref pointing straight at the commit. Confirmed
      # via the actual checkout log for v0.3.7: `git fetch ... +<commit-sha>:refs/tags/$tag`
      # ran right after the correct `+refs/tags/*:refs/tags/*` fetch. Re-fetching
      # the tag by name (not by the SHA checkout already resolved) restores the
      # real annotated object before it's read below.
      - name: Re-fetch the annotated tag object
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # Reads the annotated tag's own message as the release title/notes (first
      # line = title, rest = notes body) - written by hand at tag time same as
      # always, e.g. `git tag -a v1.2.3 -m "v1.2.3 - Short title" -m "Fuller
      # description of what changed."` (each -m becomes its own paragraph).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          title="$(git for-each-ref "refs/tags/$tag" --format='%(contents:subject)')"
          notes="$(git for-each-ref "refs/tags/$tag" --format='%(contents:body)')"
          gh release edit "$tag" --title "$title" --notes "$notes" 2>/dev/null \
            || gh release create "$tag" --title "$title" --notes "$notes"
