[package]
name = "tarw"
version = "0.2.1"
description = "A native Linux email client (Tauri + Rust IMAP backend)"
authors = ["Dan Davies"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tarw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Registered first in run() per Tauri's own requirement - stops a second
# launch from becoming a second process against the same on-disk melib
# sqlite cache (real corruption/panic risk, see project memory for the
# SQLITE_IOERR_SHORT_READ incident this guards against).
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# melib as a git dependency rather than a vendored copy - melib hasn't
# published a crates.io release since 0.8.13 despite months of merged
# upstream fixes, so this tracks a real commit directly. Pinned to a fork
# (daviesjamesdaniel/melib-tarw-patches) carrying only the handful of fixes
# not yet merged into melib's actual master - each one gets dropped from
# that fork as it lands upstream for real, so this fork is meant to shrink
# to nothing over time, not grow. See its README for what's on top and why.
melib = { git = "https://github.com/daviesjamesdaniel/melib-tarw-patches.git", rev = "225fddc318f473996b4b71187577eaa77447273e", features = ["sqlite3"] }
indexmap = "2"
# Same version melib itself depends on - used to compute the exact path to
# melib's own on-disk mailbox/message cache (see imap_client::remove_account_data),
# rather than re-deriving XDG path logic by hand and risking it drifting
# from melib's actual behaviour.
xdg = "2"

# Pinned to the exact versions the melib fork above requires - cargo's
# default resolver otherwise picks the newest matching pre-release on
# crates.io, which can add breaking changes melib doesn't build against.
imap-codec = "=2.0.0-alpha.6"
imap-types = "=2.0.0-alpha.6"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
# Declared directly (not just relied on transitively via oauth2) so our own
# code can call it - used only for the startup GitHub-releases update check.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
keyring = { version = "4.1.6", features = ["v1", "dbus-secret-service-keyring-store"] }
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
# Used directly (alongside the plugin above) only for the new-mail
# notification, whose click-to-open behaviour needs the action-wait
# handle tauri-plugin-notification's own `.show()` doesn't expose (checked
# its source - it fires-and-forgets, no way to learn a notification was
# clicked). Pinned to the exact version tauri-plugin-notification already
# pulls in (see Cargo.lock) so both use the same build, not two copies.
notify-rust = "=4.18.0"

# cargo-deb reads this directly to produce packaging/deb's .deb - see that
# directory's README for the build command. Runtime deps mirror
# packaging/arch/PKGBUILD's depends=() array, translated to Debian names.
[package.metadata.deb]
name = "tarw"
maintainer = "Dan Davies <davies.james.daniel@gmail.com>"
copyright = "2026, Dan Davies"
license-file = ["../LICENSE", "0"]
extended-description = "A FOSS, native Linux email client - Wayland-first, built on real IMAP/SMTP infrastructure."
depends = "libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, librsvg2-2"
section = "mail"
priority = "optional"
assets = [
    ["target/release/tarw", "usr/bin/tarw", "755"],
    ["icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/dan.tarw.png", "644"],
    ["../packaging/deb/dan.tarw.desktop", "usr/share/applications/dan.tarw.desktop", "644"],
]

# cargo-generate-rpm reads this for packaging/rpm's .rpm - runtime deps
# translated to Fedora/openSUSE names, same source list as the .deb above.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tarw", dest = "/usr/bin/tarw", mode = "755" },
    { source = "icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/dan.tarw.png", mode = "644" },
    { source = "../packaging/rpm/dan.tarw.desktop", dest = "/usr/share/applications/dan.tarw.desktop", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"webkit2gtk4.1" = "*"
gtk3 = "*"
libappindicator-gtk3 = "*"
librsvg2 = "*"

